[project]
name = "mi-codex-butler"
version = "0.1.0"
description = "把小爱音箱接上 Codex 的家庭管家：音箱当耳朵和嘴，Codex 当大脑，mihome CLI 控米家设备"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "click>=8.1",
  "cryptography>=42",
  "pydantic>=2",
  "pyyaml>=6",
]

[project.scripts]
mihome = "mihome.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mihome"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
