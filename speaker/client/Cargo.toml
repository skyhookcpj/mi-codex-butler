[package]
name = "butler-client"
version = "0.1.0"
edition = "2021"
description = "管家音箱端：盯 KWS / 小爱识别日志，本地欢迎、叫醒、打断、念回复，把一句话交给 NAS"

[[bin]]
name = "butler-client"
path = "src/main.rs"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "process", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
